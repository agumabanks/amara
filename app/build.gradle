plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "co.sanaa.agent"
    compileSdk 36

    defaultConfig {
        applicationId "co.sanaa.agent"
        minSdk 24
        targetSdk 36
        versionCode 13
        versionName "0.10.0"

        // The dedicated Oppo test device is ARM64. Keeping one ABI avoids a
        // universal APK that bundles three copies of Flutter and JNI engines.
        ndk { abiFilters "arm64-v8a" }

        externalNativeBuild {
            cmake { cppFlags "-std=c++17" }
        }
    }

    signingConfigs {
        release {
            storeFile file("../sanaa-agent.keystore")
            storePassword System.getenv("KEYSTORE_PASS")
            keyAlias "sanaa"
            keyPassword System.getenv("KEY_PASS")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

dependencies {
    implementation project(":flutter")
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.work:work-runtime-ktx:2.10.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.json:json:20250517"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
}

android {
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}
