plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "co.sanaa.agent"
    compileSdk 36

    defaultConfig {
        applicationId "co.sanaa.agent"
        minSdk 24
        targetSdk 36
        versionCode 90
        versionName "0.10.77"

        // The dedicated Oppo test device is ARM64. Keeping one ABI avoids a
        // universal APK that bundles three copies of Flutter and JNI engines.
        ndk { abiFilters "arm64-v8a" }

        externalNativeBuild {
            cmake { cppFlags "-std=c++17" }
        }
    }

    signingConfigs {
        release {
            // The release key lives OUTSIDE the working tree. RELEASE.md asks for this,
            // and the previous hardcoded "../sanaa-agent.keystore" put a world-readable
            // signing key at the repo root where any local process or stray backup could
            // read it. SANAA_KEYSTORE_PATH overrides the location; the path is never
            // committed because *.keystore is gitignored and the default is outside
            // the repository entirely.
            storeFile file(providers.environmentVariable("SANAA_KEYSTORE_PATH")
                .orElse("/root/.secrets/sanaa-agent.keystore").get())
            storePassword System.getenv("KEYSTORE_PASS")
            keyAlias "sanaa"
            keyPassword System.getenv("KEY_PASS")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Dedicated device updates must retain the installed signing identity.
            // Opt-in only; normal distribution continues to use the release key.
            signingConfig project.hasProperty("deviceContinuitySigning") ? signingConfigs.debug : signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

dependencies {
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // Required, not optional: MainActivity extends FlutterActivity and the UI bridge
    // uses io.flutter.embedding.engine MethodChannel, so the module must be on the
    // compile classpath. settings.gradle declares it via
    // flutter_ui/.android/include_flutter.groovy, which is gitignored and generated by
    // `flutter pub get` — that is why the CI Gradle job now runs `flutter pub get`
    // before Gradle. Making this conditional was tried and reverted: it lets
    // configuration succeed but then fails compilation with unresolved
    // io.flutter/FlutterActivity references, which is a worse failure mode than
    // failing fast at configuration time.
    implementation project(":flutter")
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.work:work-runtime-ktx:2.10.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0"
    implementation "org.json:json:20250517"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
}

android {
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}
