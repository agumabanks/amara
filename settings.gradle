pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

rootProject.name = "SanaaAgent"
include ":app"

// Flutter's Gradle glue lives in flutter_ui/.android/include_flutter.groovy, which
// is generated by `flutter pub get` and is gitignored (flutter_ui/.gitignore:40).
// Applying it unconditionally made every CI run die at settings evaluation with
// "Could not read script ... include_flutter.groovy as it does not exist" — the
// three previous CI runs on this repo all failed this way, so the Gradle job has
// never once been green.
//
// Apply it only when the generated file is actually present. Locally it exists
// after `flutter pub get`; on CI the Flutter job is separate and does not need it.
// `project(":flutter")` is declared by include_flutter.groovy itself, so skipping
// it here only means the :flutter module is absent, which matters solely for a
// full app build that embeds the Flutter engine.
def flutterInclude = file("flutter_ui/.android/include_flutter.groovy")
if (flutterInclude.exists()) {
    apply from: flutterInclude
} else {
    logger.lifecycle("SanaaAgent: skipping Flutter Gradle glue (${flutterInclude} not generated). " +
            "Run `cd flutter_ui && flutter pub get` before building the full app.")
}
