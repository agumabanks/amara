pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

rootProject.name = "SanaaAgent"
include ":app"
apply from: file("flutter_ui/.android/include_flutter.groovy")
