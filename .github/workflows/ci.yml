name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gradle:
    name: Gradle (Android unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Setup Gradle (vendors wrapper)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # app/build.gradle declares `implementation project(":flutter")` and
      # settings.gradle applies flutter_ui/.android/include_flutter.groovy. Both only
      # exist after `flutter pub get` runs, and that glue file is gitignored — so a
      # bare checkout has neither, and the Gradle job died at settings evaluation on
      # all three previous CI runs ("Could not read script
      # .../include_flutter.groovy as it does not exist"). Generate the glue first.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.2'
          cache: true

      # Must satisfy flutter_ui/pubspec.yaml `environment: sdk: ^3.9.0`. This
      # workflow previously pinned 3.24.5 (Dart 3.5.x), which cannot resolve that
      # constraint, so `flutter pub get` also failed in the Flutter job.
      - name: flutter pub get
        working-directory: flutter_ui
        run: flutter pub get

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.2'
          cache: true

      - name: flutter pub get
        working-directory: flutter_ui
        run: flutter pub get

      - name: flutter analyze
        working-directory: flutter_ui
        run: flutter analyze

      - name: flutter test
        working-directory: flutter_ui
        run: flutter test

      - name: Dart format check
        working-directory: flutter_ui
        run: dart format --output=none --set-exit-if-changed lib test

  mission-gates:
    name: Mission gates (boundary + redaction)
    runs-on: ubuntu-latest
    # The negative-fixture harness re-runs the full traceability audit once per
    # defective matrix (23 cases). Each audit is ~3-4 minutes because it re-parses
    # every JUnit XML and re-scans app/src/main, so budget ~90 min explicitly rather
    # than relying on the 360-minute default and discovering the cost as a hang.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Setup Gradle (vendors wrapper)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # These two gates are source-only: no keystore, no device, no release APK.
      # They used to run only inside mission/amara-10-10/scripts/run_local_gates.sh,
      # which a human invokes by hand, so a regression could land unnoticed.
      - name: Side-effect boundary
        run: bash mission/amara-complete-employee/scripts/check_side_effect_boundary.sh

      - name: Evidence redaction
        run: bash mission/amara-complete-employee/scripts/check_evidence_redaction.sh

      - name: Traceability negative fixture (harness self-test)
        run: bash mission/amara-complete-employee/scripts/check_traceability.sh negative-fixture

  # The full traceability audit needs a signed release APK and its recorded sha256
  # (see the stale-APK guard in check_traceability.sh). CI has no signing secret, so
  # it cannot produce that APK and the audit would always fail here. It runs for
  # signal; it is enforced locally by run_local_gates.sh.
  traceability-audit:
    name: Traceability audit (informational, needs signed APK)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle (vendors wrapper)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Same reason as the gradle job: settings.gradle and app/build.gradle both
      # need the generated Flutter glue before Gradle can evaluate or resolve
      # project(":flutter").
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.2'
          cache: true

      - name: flutter pub get
        working-directory: flutter_ui
        run: flutter pub get

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Traceability audit
        run: bash mission/amara-complete-employee/scripts/check_traceability.sh || true
